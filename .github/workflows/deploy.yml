name: Build & Deploy → Hostinger SFTP

# Déclencheurs : push sur main + bouton manuel "Run workflow"
on:
  push:
    branches: [main]
  workflow_dispatch:

# Empêche deux déploiements concurrents
concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Build statique Next.js + upload SFTP
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (export statique)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Sécurité : `config.php` ne doit JAMAIS être uploadé
      #   (il vit uniquement sur Hostinger, mis en place une fois en SSH)
      - name: Safety check — pas de config.php dans out/
        run: |
          if [ -f out/api/config.php ]; then
            echo "::error::out/api/config.php est présent ! Cela écraserait les secrets SMTP."
            exit 1
          fi
          echo "✓ out/api/config.php absent — config Hostinger préservé."
          if [ -d out/api/data ]; then
            echo "::error::out/api/data/ est présent ! Cela écraserait les compteurs de vues en production."
            exit 1
          fi

      # Déploiement via SSH/rsync — auth par clé privée (jamais par mdp).
      #   - rsync ne supprime PAS les fichiers distants (préserve config.php et tout fichier ajouté à la main)
      #   - --exclude protège explicitement /api/config.php au cas où
      - name: Deploy via SSH + rsync
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SFTP_HOST }}
          REMOTE_PORT: ${{ secrets.SFTP_PORT }}
          REMOTE_USER: ${{ secrets.SFTP_USERNAME }}
          SOURCE: "out/"
          TARGET: ${{ secrets.SFTP_REMOTE_PATH }}
          # Options rsync : archive, verbose, compression, raccourcir output.
          #   --no-perms / --no-times : Hostinger n'autorise pas chmod arbitraire
          #   --exclude : double-protection du config.php
          ARGS: "-rlzv --no-perms --no-times --exclude='api/config.php' --exclude='api/data/'"

      # IndexNow : notifie Bing / Yandex / Seznam des URLs du sitemap après
      # chaque déploiement (le script lit le sitemap fraîchement déployé en
      # prod). Alimente aussi l'index utilisé par ChatGPT Search et Copilot.
      # Non bloquant : un échec IndexNow ne doit pas faire échouer le deploy.
      - name: Notifier IndexNow (Bing)
        if: success()
        run: node scripts/indexnow-submit.mjs || echo "::warning::IndexNow a échoué (non bloquant)"

      - name: Récapitulatif
        if: success()
        run: |
          echo "✅ Déploiement réussi sur https://agence-kinome.ch"
          echo "Build : ${{ github.sha }}"
          echo "Auteur : ${{ github.actor }}"
